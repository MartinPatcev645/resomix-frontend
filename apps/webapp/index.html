<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- No-flash guard for the beta notice. It renders by default so first-time visitors get no
       layout shift when it appears; a visitor who dismissed it would otherwise watch it sit there
       until React hydrated. The flag lives in localStorage, which the shell can read synchronously
       before first paint. Keep the key in sync with OptionalAuthRoute. -->
  <script>
    try {
      if (localStorage.getItem("demo_stage_notice_dismissed") === "true")
        document.documentElement.setAttribute("data-demo-dismissed", "");
    } catch (e) { /* storage blocked — showing the notice is the safe default */ }
  </script>
  <style>[data-demo-dismissed] [data-demo-banner] { display: none; }</style>
  <title>Resomix Sonic Discovery - Beta</title>
  <meta name="title" content="Resomix Sonic Discovery - Beta">
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    
    // DEFAULT DENIED: The legal requirement for GCM v2
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied',
      'wait_for_update': 500
    });
    
    gtag('js', new Date());
    gtag('config', 'GTM-PD9XQZRV'); 
  </script>
  <!-- Google Tag Manager is NOT loaded here any more; it is injected on an idle callback after
       load (see useGoogleTagManager + App.tsx). The consent defaults above stay inline and
       synchronous, because Consent Mode v2 requires them to run before the container. -->

  <!-- iOS Audio Recognition & Trust -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resomix">
  <meta name="application-name" content="Resomix">
  <meta name="author" content="Resomix">
  <meta property="og:site_name" content="Resomix">
  <meta property="og:locale" content="en_US">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <!--
    DEFAULTS ONLY. src/components/RouteMeta.tsx rewrites title, description, canonical, robots and
    the og:/twitter: tags per route.

    Previously this was a blanket "noindex, nofollow" while robots.txt invited crawling and shipped
    a sitemap — three contradictory signals. Crawling is now allowed, and the pages that should stay
    out of the index (the signed-in workspace, the auth screens) say so individually.

    nofollow is gone entirely: it stranded link equity on every outbound link for no benefit.
  -->
  <meta name="robots" content="index, follow">
  <meta name="description" content="Drop a reference track and get ranked matches that actually belong next to it. Sonic discovery, track analysis and playlists in one workspace.">
  <link rel="canonical" href="https://beta.resomix.com/">

  <!-- Open Graph. og:type is "website": "music.radio_station" described a stream this app is not,
       and the og:audio pointed at a bare media host with no playable resource. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://beta.resomix.com/">
  <meta property="og:title" content="Resomix — Find Tracks by Sound">
  <meta property="og:description" content="Drop a reference track and get ranked matches that actually belong next to it.">
  <meta property="og:image" content="https://beta.resomix.com/og-cover.png">
  <meta property="og:image:alt" content="Resomix — find tracks by sound">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Resomix — Find Tracks by Sound">
  <meta name="twitter:description" content="Drop a reference track and get ranked matches that actually belong next to it.">
  <meta name="twitter:image" content="https://beta.resomix.com/og-cover.png">

  <!-- Structured data: read without executing the app, so every crawler sees it. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Resomix",
      "url": "https://beta.resomix.com/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any",
      "description": "Reference-based music discovery, track analysis and playlist building.",
      "publisher": { "@type": "Organization", "name": "Resomix", "url": "https://resomix.com/" }
    }
  </script>

  <meta name="apple-itunes-app" content="app-argument=resomix-audio">

  <!-- Critical app fonts (@font-face families actually used: Helvetica_Neue, Fira Code, Benzin).
       Montserrat / Auger Mono faces exist in fonts.css but are unused in webapp src — not preloaded.
       FiraCode-VariableFont_wght.ttf is in public/fonts/ but has no @font-face — not preloaded. -->
  <!-- One preconnect, deliberately.
     Lighthouse warned "More than 4 preconnect connections were found" and reported the API one
     as "Unused preconnect. Check that the crossorigin attribute is used properly" — a bare
     `crossorigin` means anonymous, but the API client sends `withCredentials: true`, so the
     connection never matched and was never reused. `use-credentials` fixes that.

     The other three (PostHog, GTM, Google accounts) were dropped: all three are now deferred to
     an idle callback, so warming a socket during load buys nothing and only crowds out the one
     connection that IS on the critical path. Lighthouse still estimates 310 ms (mobile) /
     100 ms (desktop) from this one. -->
  <link rel="preconnect" href="https://bserver.resomix.com" crossorigin="use-credentials">

  <!-- Preload only the faces that gate first paint, as the Latin subset:
       Benzin 700  — the hero <h1>, which Lighthouse reported as the desktop LCP element
       Helvetica 300 — body copy (the page root is `font-helvetica font-light`)
       Fira Code 500 — nav/eyebrow type, and the largest single CLS culprit (0.059)
     These were previously discovered only after index.css parsed, which is why a font sat at
     the END of the critical path. Preloading breaks that chain. Deliberately three, not all:
     preloading everything just front-loads the same bytes and helps nothing. -->
  <link rel="preload" href="/fonts/benzin-bold.latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/HelveticaNeueLight.latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/FiraCode-Medium.latin.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body class="bg-[var(--color-secondary)]">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PD9XQZRV" height="0" width="0"
      style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
