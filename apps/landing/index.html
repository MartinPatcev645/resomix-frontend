<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resomix — Hear the Invisible | Sonic Intelligence Platform</title>
    <!-- type corrected: this is a PNG, and it was declared as image/svg+xml. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      // DEFAULT DENIED: The legal requirement for GCM v2
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        wait_for_update: 500,
      });

      gtag("js", new Date());
      gtag("config", "GTM-PD9XQZRV");
    </script>
    <!-- Google Tag Manager is NOT loaded here any more.
         It is the most expensive third party on the site — and it is also what loads PostHog
         (7 scripts, 182 KiB), which appears nowhere in this repo. Loading it in <head> put ~301 KiB
         and ~375 ms of main-thread work in front of first paint, for scripts that render nothing.
         It is now injected on an idle callback after load; see useGoogleTagManager + App.tsx.

         The consent defaults above stay inline and synchronous on purpose: Consent Mode v2 requires
         them to run BEFORE the container. They cost no request. -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
      
    />
    <meta name="apple-mobile-web-app-title" content="Resomix" />
    <meta name="application-name" content="Resomix" />
    <meta name="author" content="Resomix" />
    <meta property="og:site_name" content="Resomix" />
    <meta property="og:locale" content="en_US" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <!--
      DEFAULTS ONLY. src/components/RouteMeta.tsx rewrites the title, description, canonical and
      the og:/twitter: tags below on every route change.

      They still matter: Googlebot renders JavaScript, but the scrapers behind Slack, WhatsApp,
      iMessage, LinkedIn and Facebook do NOT — they read this raw HTML. So these values are what a
      shared link previews as, whichever page was shared. Keep them describing the site as a whole.
    -->
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Resomix finds music by how it sounds, not how it is tagged. Drop one track and discover what belongs next to it."
    />
    <link rel="canonical" href="https://resomix.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resomix.com/" />
    <meta property="og:title" content="Resomix — Hear the Invisible | Sonic Intelligence Platform" />
    <meta
      property="og:description"
      content="Resomix finds music by how it sounds, not how it is tagged. Drop one track and discover what belongs next to it."
    />
    <!-- TODO: replace with a 1200x630 landscape asset; this is the 399x399 logo and will crop to a small square card. -->
    <meta property="og:image" content="https://resomix.com/logo.png" />
    <meta property="og:image:alt" content="Resomix — sonic intelligence platform" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resomix — Hear the Invisible | Sonic Intelligence Platform" />
    <meta
      name="twitter:description"
      content="Resomix finds music by how it sounds, not how it is tagged. Drop one track and discover what belongs next to it."
    />
    <meta name="twitter:image" content="https://resomix.com/logo.png" />

    <!--
      Structured data, kept in the static HTML on purpose: unlike the tags above it is read without
      executing the app, so it works for every crawler.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://resomix.com/#organization",
            "name": "Resomix",
            "url": "https://resomix.com/",
            "logo": "https://resomix.com/logo.png",
            "description": "Sonic intelligence platform for discovering, analysing and indexing music by sound."
          },
          {
            "@type": "WebSite",
            "@id": "https://resomix.com/#website",
            "url": "https://resomix.com/",
            "name": "Resomix",
            "publisher": { "@id": "https://resomix.com/#organization" }
          }
        ]
      }
    </script>

    <!-- Preconnect to the third-party origins the page contacts during load. Lighthouse reported
         no preconnected origins at all, and estimated 370 ms (PostHog) + 320 ms (the API) of LCP
         on mobile from establishing these connections late. Kept to four, as recommended — each
         one costs a socket. -->
    <link rel="preconnect" href="https://eu.i.posthog.com" crossorigin>
    <link rel="preconnect" href="https://bserver.resomix.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://accounts.google.com" crossorigin>

    <!-- Preload only the faces that gate first paint, as the Latin subset:
           Benzin 700  — the hero <h1>, which Lighthouse reported as the desktop LCP element
           Helvetica 300 — body copy (the page root is `font-helvetica font-light`)
           Fira Code 500 — nav/eyebrow type, and the largest single CLS culprit (0.059)
         These were previously discovered only after index.css parsed, which is why a font sat at
         the END of the critical path. Preloading breaks that chain. Deliberately three, not all:
         preloading everything just front-loads the same bytes and helps nothing. -->
    <link rel="preload" href="/fonts/benzin-bold.latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/HelveticaNeueLight.latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/FiraCode-Medium.latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Humans.txt -->
    <link type="text/plain" rel="author" href="/humans.txt" />
  </head>

  <body class="bg-[var(--color-secondary)]">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-PD9XQZRV"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
