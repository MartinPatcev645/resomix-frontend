    "title": "Resomix B2B Partner API",
    "description": "# Resomix B2B Partner API\n\nWelcome to the **Resomix B2B Partner API** documentation!\n\nThis API allows partners to seamlessly integrate audio similarity and metadata extraction capabilities directly into their supply-chain pipelines. \n\n## Authentication\n\nAll endpoints (except `/health`) require authentication using a **B2B Bearer API Key** (`rmx_<tier>_...`). Pass this key in the `Authorization` header of your HTTP requests:\n```\nAuthorization: Bearer rmx_starter_1234567890\n```\n\n## Features\n\n- **Catalog Similarity Search**: Query the sandboxed FAISS index by your internal track ID.\n- **Realtime Similarity**: Upload audio files to check similarity on the fly.\n- **Metadata Extraction**: Parse and validate audio properties before heavy ingestion.\n",

  },

                  "type": "integer"
                },
                {
                  "type": "null"
                }
              ],

              "title": "Top Sk"
            },
            "description": "Number of similar tracks to return (10, 20, 50, or 100)"
          },

            "name": "engine",
            "in": "query",
            "required": false,

                  "type": "string"
                },
                {
                  "type": "null"
