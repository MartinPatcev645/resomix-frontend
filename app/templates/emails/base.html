<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border: 2px solid #222222;
            overflow: hidden;
        }

        .header {
            padding: 28px 20px;
            text-align: center;
            border-bottom: 1px dotted #cccccc;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #1a1a1a;
        }

        .content {
            padding: 32px 28px;
        }

        /* Ensure default text inside content is visible */
        .content,
        .content * {
            color: #1a1a1a;
        }

        .content h2 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin: 0 0 20px 0;
            color: #1a1a1a;
        }

        .content p {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.6;
            margin: 12px 0;
            color: #1a1a1a;
        }

        .button {
            display: inline-block;
            background-color: #ffffff;
            color: #1a1a1a !important;
            padding: 12px 28px;
            text-decoration: none;
            border: 1px dotted #cccccc;
            font-weight: 300;
            font-size: 14px;
            margin: 20px 0;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .button:hover {
            border-color: #1a1a1a;
        }

        .code-box {
            background-color: transparent;
            padding: 24px;
            text-align: center;
            margin: 24px 0;
            border: 2px dotted #cccccc;
        }

        .code {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 12px;
            color: #1a1a1a;
            font-family: 'Courier New', 'Courier', monospace;
        }

        .footer {
            background-color: transparent;
            padding: 24px 20px;
            text-align: center;
            color: #666666;
            font-size: 11px;
            font-weight: 300;
            border-top: 1px dotted #cccccc;
        }

        .footer p {
            margin: 6px 0;
            letter-spacing: 0.5px;
        }

        .alert {
            padding: 16px;
            background-color: transparent;
            border: 1px dotted #cccccc;
            margin: 20px 0;
        }

        /* Boxed list — "what you've unlocked", "in the meantime, try Resomix". Defined here
           because welcome.html and contact_confirmation.html each carry an identical copy in
           their own inline CSS; new templates extend this instead of adding a third. */
        .features {
            padding: 20px;
            background-color: transparent;
            border: 1px dotted #cccccc;
            margin: 24px 0;
        }

        .features h3 {
            margin-top: 0;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #1a1a1a;
        }

        .features ul {
            margin: 16px 0;
            padding-left: 20px;
        }

        .features li {
            margin: 12px 0;
            color: #1a1a1a;
            font-size: 13px;
            font-weight: 300;
            line-height: 1.6;
        }

        .alert-danger {
            border-color: #666666;
        }

        .text-muted {
            color: #666666;
            font-size: 12px;
            font-weight: 300;
        }

        .link {
            color: #1a1a1a;
            text-decoration: underline;
            word-break: break-all;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0a0a0a;
            }

            .container {
                background-color: #1a1a1a;
                border-color: #333333;
            }

            .header h1,
            .content h2,
            .content p,
            .code,
            .link,
            .button {
                color: #ffffff !important;
            }

            .alert p,
            .alert-danger p,
            .alert strong,
            .alert-danger strong {
                color: #ffffff !important;
            }

            .content,
            .content * {
                color: #ffffff !important;
            }

            .footer,
            .footer p {
                color: #999999 !important;
            }

            .text-muted {
                color: #999999 !important;
            }

            .button {
                background-color: #1a1a1a;
                border-color: #666666;
            }

            .code-box,
            .features,
            .alert {
                border-color: #666666;
            }

            .header {
                border-bottom-color: #666666;
            }

            .footer {
                border-top-color: #666666;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>RESOMIX</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>&copy; 2026 Resomix. All rights reserved.</p>
            <p>Audio Similarity Engine for Music Discovery</p>
        </div>
    </div>
</body>

</html>
